<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta name="theme-color" content="#08090a" />

    <!--
      Baseline metadata, present in the served HTML so it reaches crawlers that
      do not execute JavaScript. The build overwrites the marked block below
      per route (see scripts/prerender.mjs); this copy is what the home page
      and any un-prerendered route falls back to.
    -->
    <!--seo-->
    <title>Nexa Gadgets | 20% off electronics, same-day delivery in all 50 states</title>
    <meta
      name="description"
      content="US electronics retailer with physical stores in all 50 states. Phones, laptops, TVs and more at 20% below retail, with same-day delivery and a 50% deposit option."
    />
    <link rel="canonical" href="https://nexagadgets.us/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexa Gadgets" />
    <meta property="og:title" content="Nexa Gadgets | 20% off electronics, same-day delivery" />
    <meta
      property="og:description"
      content="Physical stores in all 50 states. Reserve online with a 50% deposit and pay the balance on delivery."
    />
    <meta property="og:url" content="https://nexagadgets.us/" />
    <meta property="og:image" content="https://nexagadgets.us/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nexa Gadgets — premium tech, delivered today" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexa Gadgets | 20% off electronics, same-day delivery" />
    <meta
      name="twitter:description"
      content="Physical stores in all 50 states. Reserve online with a 50% deposit and pay the balance on delivery."
    />
    <meta name="twitter:image" content="https://nexagadgets.us/brand/og.jpg" />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
